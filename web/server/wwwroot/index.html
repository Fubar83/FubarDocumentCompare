<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>printcmp</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <h1>printcmp</h1>
    <span class="muted" id="version"></span>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="label" aria-selected="true">Etikett / ark</button>
      <button role="tab" data-tab="documents">Dokument</button>
      <button role="tab" data-tab="data">Datakontroll</button>
    </nav>
  </header>

  <main>
    <!-- Etikett: original först (inspektera lager och dekorfärger), sedan provet -->
    <section class="panel" data-panel="label">
      <form id="ref-form" class="card">
        <h2>1. Original (PDF)</h2>
        <label class="file">PDF <input type="file" name="pdf" accept=".pdf" required></label>
        <div class="row">
          <label>Profil
            <select name="profile">
              <option value="Label">Etikett</option>
              <option value="LabelStrict">Etikett, strikt</option>
              <option value="Leaflet">Bipacksedel</option>
              <option value="Pdf">PDF mot PDF</option>
            </select>
          </label>
          <label>Box
            <select name="box"><option>trim</option><option>media</option><option>crop</option><option>art</option></select>
          </label>
          <label>Sida <input type="number" name="page" value="1" min="1"></label>
        </div>
        <div id="ref-info" class="info" hidden></div>
        <button type="submit">Analysera original</button>
      </form>

      <form id="cmp-form" class="card" hidden>
        <h2>2. Prov</h2>
        <label class="file">Scan (TIFF/PNG/JPEG) eller PDF <input type="file" name="sample" accept=".tif,.tiff,.png,.jpg,.jpeg,.pdf" required></label>
        <div class="row">
          <label>Etiketter på arket <input type="number" name="expectedLabels" min="0" value="0"></label>
          <label>Rader <input type="number" name="rows" min="0" value="0"></label>
          <label>Kolumner <input type="number" name="cols" min="0" value="0"></label>
          <label>DPI (0 = ur filen) <input type="number" name="dpi" min="0" value="0"></label>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" name="multi"> Flera etiketter</label>
          <label class="check"><input type="checkbox" name="consensus" checked> Jämför etiketterna mot varandra</label>
          <label class="check"><input type="checkbox" name="colorCalibrated"> IT8-kalibrerad scanner</label>
        </div>
        <label class="file">Förväntade uppgifter (valfritt) <input type="file" name="expected" accept=".txt,.csv,.json"></label>
        <button type="submit">Jämför</button>
      </form>
    </section>

    <section class="panel" data-panel="documents" hidden>
      <form id="doc-form" class="card">
        <h2>Manus mot färdigt dokument</h2>
        <div class="row">
          <label class="file">Referens (manus) <input type="file" name="reference" accept=".pdf" required></label>
          <label class="file">Prov (bok/tryck-PDF) <input type="file" name="sample" accept=".pdf" required></label>
        </div>
        <div class="row">
          <label>Layout
            <select name="layout"><option value="reflow">Omflödad (manus → bok)</option><option value="fixed">Fast (samma sidor)</option></select>
          </label>
          <label class="check"><input type="checkbox" name="compareFurniture"> Jämför sidhuvud/sidfot</label>
          <label class="check"><input type="checkbox" name="strictTypography"> Strikt typografi</label>
          <label class="check"><input type="checkbox" name="ignoreCase"> Ignorera versaler</label>
        </div>
        <label class="file">Förväntade uppgifter (valfritt) <input type="file" name="expected" accept=".txt,.csv,.json"></label>
        <button type="submit">Jämför</button>
      </form>
    </section>

    <section class="panel" data-panel="data" hidden>
      <form id="data-form" class="card">
        <h2>Hitta uppgifter i en PDF</h2>
        <div class="row">
          <label class="file">PDF <input type="file" name="pdf" accept=".pdf" required></label>
          <label class="file">Förväntat (.txt/.csv/.json) <input type="file" name="expected" accept=".txt,.csv,.json" required></label>
          <label>Rad (nummer eller kolumn=värde) <input type="text" name="row" placeholder="bäst stämmande"></label>
        </div>
        <button type="submit">Kontrollera</button>
      </form>
    </section>

    <p id="error" class="error" role="alert" hidden></p>

    <!-- Pågående/färdigt jobb -->
    <section id="job" class="card" hidden>
      <div class="job-head">
        <h2 id="job-title">Jobb</h2>
        <button id="cancel" class="secondary">Avbryt</button>
        <a id="report" class="button secondary" target="_blank" hidden>Hela rapporten</a>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <p id="stage" class="muted"></p>
      <div class="live">
        <svg id="sheet" aria-label="Arket" hidden></svg>
        <ol id="log" class="log"></ol>
      </div>
      <div id="summary" class="chips"></div>
      <div id="labels" class="labels"></div>
      <div id="data-items"></div>
      <div id="findings-tools" class="row" hidden>
        <label>Typ <select id="f-kind"><option value="">alla</option></select></label>
        <label>Minst säkerhet
          <select id="f-cert"><option value="3">alla</option><option value="2">trolig</option><option value="1">hög</option><option value="0">bekräftad</option></select>
        </label>
        <label class="check"><input type="checkbox" id="f-hide-ok" checked> Dölj godkända</label>
      </div>
      <div id="findings"></div>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
